<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Student Management System</h1>
            <p>Efficiently manage your student database</p>
        </header>

        <main class="main-content">
            <!-- Form Section -->
            <section class="form-section glass-panel">
                <h2 id="form-title">Add New Student</h2>
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="input-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" min="1" placeholder="e.g. 20" required>
                    </div>
                    <div class="input-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="e.g. Computer Science" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn primary-btn">Save Student</button>
                        <button type="button" id="cancel-btn" class="btn secondary-btn hidden">Cancel Edit</button>
                    </div>
                </form>
                <div id="message-box" class="message-box hidden"></div>
            </section>

            <!-- Table Section -->
            <section class="table-section glass-panel">
                <h2>Student Records</h2>
                <div class="table-wrapper">
                    <table id="student-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Department</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="student-tbody">
                            <!-- Data injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
